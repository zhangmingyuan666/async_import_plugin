[package]
name = "s1s_async_import_plugin"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[profile.release]
lto = true

[dependencies]
serde          = { version = "1.0.203", features = ["derive"] }
serde_json       = "1.0.117"
swc_atoms      = "5.0.0"
swc_cached     = "2.0.0"
swc_common       = { version = "9.1.0", features = ["concurrent"] }
swc_core         = { version = "23", features = ["ecma_plugin_transform"] }
swc_ecma_ast     = "9.0.0"
swc_ecma_utils   = "13.0.0"
swc_ecma_visit   = "9.0.0"
swc_plugin_macro = "1.1.0"
tracing          = { version = "0.1.40", features = ["release_max_level_off"] }

[dev-dependencies]
swc_ecma_parser             = "12.0.0"
swc_ecma_transforms_base    = "13.0.0"
swc_ecma_transforms_testing = "16.0.0"
testing                     = "10.0.0"
# .cargo/config defines few alias to build plugin.
# cargo build-wasi generates wasm-wasi32 binary
# cargo build-wasm32 generates wasm32-unknown-unknown binary.
