[package]
name = "s1s_async_import_plugin"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[profile.release]
lto = true

[dependencies]
serde          = { version = "1", features = ["derive"] }
serde_json       = "1"
swc_core         = { version = "58.0.3", features = ["ecma_plugin_transform", "ecma_utils", "common"] }
tracing          = { version = "0.1.37", features = ["release_max_level_off"] }
getrandom        = { version = "0.2", features = ["custom"] }

[dev-dependencies]
swc_core = { version = "58.0.3", features = ["ecma_plugin_transform", "ecma_utils", "common", "testing_transform", "ecma_parser", "ecma_parser_typescript", "ecma_visit"] }
swc_ecma_parser = { version = "35.0.0", features = ["typescript"] }
swc_ecma_transforms_testing = "42.0.0"
swc_ecma_visit = "21.0.0"
testing                     = "20.0.0"
# .cargo/config defines few alias to build plugin.
# cargo build-wasi generates wasm-wasi32 binary
# cargo build-wasm32 generates wasm32-unknown-unknown binary.
